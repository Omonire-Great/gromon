name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # 3.9 is the floor we claim in pyproject.toml, so it is the one that matters
    # most; the rest catch the code breaking on a newer runtime.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check gromon tests

      - name: Test
        run: pytest -q

      - name: The examples still run
        run: |
          gromon routes examples/blog
          gromon routes examples/hello.py
          gromon routes examples/chat.py

  # The core claims to need nothing from PyPI. This job proves it by never
  # installing the extras and running everything that does not touch Jinja2.
  core-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install without extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .

      - name: Fail if Jinja2 came along anyway
        run: |
          python - <<'PY'
          import importlib.util, sys
          if importlib.util.find_spec("jinja2") is not None:
              sys.exit("jinja2 should not be installed for this job")
          print("no jinja2: the core really is dependency free")
          PY

      - name: Test everything else
        run: pytest -q --ignore=tests/test_templates.py --ignore=tests/test_url_for.py
